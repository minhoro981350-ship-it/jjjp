<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일본어 시험 마스터</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:sans-serif;background:#f4f7f6;color:#333;margin:0;padding:10px}
h1{font-size:1.2rem;text-align:center;color:#2c3e50;margin:5px 0 12px}
.tab-nav{display:flex;gap:3px;margin-bottom:10px}
.tab-nav button{flex:1;padding:10px 1px;background:#4A90E2;color:#fff;font-weight:bold;font-size:.76rem;border:none;border-radius:6px;cursor:pointer;line-height:1.2;word-break:keep-all}
.tab-nav button.active{background:#2C3E50}
.tab-content{display:none;background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tab-content.active{display:block}
.card{border:1px solid #e0e0e0;padding:10px;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.group-tag{background:#e1f5fe;color:#0288d1;padding:2px 5px;border-radius:4px;font-size:.75rem;font-weight:bold}
.group-tag.exc{background:#ffebee;color:#c62828}
.conj-row{font-size:.82rem;color:#555;margin-top:5px;background:#f8f9fa;padding:5px 8px;border-radius:4px;line-height:1.45}
.conj-row b{color:#2c3e50}
.star-btn{background:none;border:none;font-size:1.5rem;color:#ccc;cursor:pointer;padding:0 5px}
.star-btn.starred{color:#f1c40f}
.filter-box{background:#f8f9fa;padding:8px 10px;border-radius:6px;border:1px solid #ddd;margin-bottom:10px;font-size:.85rem;font-weight:bold;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
select.mode-select{padding:5px 8px;border-radius:5px;border:1px solid #ccc;font-size:.82rem;font-weight:bold;color:#2c3e50;background:#fff}
.mode-switch{display:flex;gap:5px;margin-bottom:8px;background:#eef2f5;padding:4px;border-radius:8px}
.mode-switch button{flex:1;padding:8px;border:none;border-radius:6px;font-weight:bold;font-size:.82rem;background:transparent;color:#555;cursor:pointer}
.mode-switch button.active{background:#fff;color:#2c3e50;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mode-switch.script-switch{background:#fce4ec}
.mode-switch.script-switch button.active{color:#d81b60}
.canvas-container{width:100%;display:flex;justify-content:center;margin:10px 0}
canvas{border:2px dashed #ff69b4;background:#fff;border-radius:8px;touch-action:none}
.btn{width:100%;padding:12px;border:none;border-radius:6px;background:#4A90E2;color:#fff;font-weight:bold;font-size:1rem;margin-top:8px;cursor:pointer}
.btn-sub{background:#7f8c8d}.btn-ans{background:#27ae60}.btn-next{background:#34495e;margin-top:14px}
.quiz-badge{display:inline-block;background:#2c3e50;color:#fff;font-size:.78rem;padding:3px 8px;border-radius:12px;margin-bottom:8px}
.quiz-prompt{font-size:1.18rem;font-weight:bold;margin-bottom:12px;color:#2c3e50;line-height:1.45;white-space:pre-line}
.hint-text{font-size:.82rem;color:#666;margin-bottom:8px}
.typing-input{width:100%;padding:12px;font-size:1.1rem;border:2px solid #4A90E2;border-radius:6px;text-align:center;font-weight:bold;outline:none}
.feedback-box{margin-top:10px;padding:10px;border-radius:6px;font-weight:bold;text-align:center;font-size:.95rem;line-height:1.45;display:none}
.feedback-ok{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.feedback-no{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
</style>
</head>
<body>
<h1>📚 일본어 시험 단어장</h1>
<div class="tab-nav">
  <button id="btn-t1" class="active" onclick="goTab('t1')">📖 단어</button>
  <button id="btn-t5" onclick="goTab('t5')">🎯 어휘퀴즈</button>
  <button id="btn-t2" onclick="goTab('t2')">🧠 개념연습</button>
  <button id="btn-t3" onclick="goTab('t3')">✍️ 활용퀴즈</button>
  <button id="btn-t4" onclick="goTab('t4')">📝 쓰기</button>
</div>

<div id="t1" class="tab-content active">
  <div class="filter-box">
    <span><input type="checkbox" id="starOnly" onchange="renderWordList()"> <label for="starOnly">⭐ 헷갈리는 단어만 보기</label></span>
    <span style="font-size:.8rem;color:#666">(총 <b id="wordCount">0</b>개)</span>
  </div>
  <div id="wordList"></div>
</div>

<div id="t5" class="tab-content">
  <div class="mode-switch">
    <button id="vType-mean" class="active" onclick="setVocabType('mean')">🇰🇷 동사 뜻 맞추기</button>
    <button id="vType-match" onclick="setVocabType('match')">🔗 한자↔히라가나</button>
  </div>
  <div id="vMeanScriptBox" class="mode-switch script-switch">
    <button id="vScript-kanji" class="active" onclick="setVocabScript('kanji')">🈳 한자 제시</button>
    <button id="vScript-hira" onclick="setVocabScript('hira')">🔤 히라가나 제시</button>
  </div>
  <div id="vMatchDirBox" class="mode-switch script-switch" style="display:none">
    <button id="vDir-k2h" class="active" onclick="setVocabDir('k2h')">🈳 한자 ➔ 히라가나</button>
    <button id="vDir-h2k" onclick="setVocabDir('h2k')">🔤 히라가나 ➔ 한자</button>
  </div>
  <div class="filter-box">
    <span><input type="checkbox" id="vocabStarOnly" onchange="nextVocab()"> <label for="vocabStarOnly">⭐ 별표 단어만 출제</label></span>
  </div>
  <div id="vocabBadge" class="quiz-badge"></div>
  <div id="vocabQ" class="quiz-prompt"></div>
  <div id="vocabOpts"></div>
  <div id="vocabFeedback" class="feedback-box"></div>
  <button class="btn btn-next" onclick="nextVocab()">다음 어휘 문제 ➔</button>
</div>

<div id="t2" class="tab-content">
  <div class="mode-switch">
    <button id="cMode-choice" class="active" onclick="setConceptMode('choice')">🔘 4지선다 고르기</button>
    <button id="cMode-type" onclick="setConceptMode('type')">⌨️ 직접 타자 입력</button>
  </div>
  <div class="filter-box">
    <span>연습 범위:</span>
    <select id="conceptFilter" class="mode-select" onchange="nextConcept()">
      <option value="all">전체 문법 규칙 (て·ない)</option>
      <option value="te">て형 변환 규칙만</option>
      <option value="nai">ない형 변환 규칙만</option>
    </select>
  </div>
  <div id="conceptBadge" class="quiz-badge"></div>
  <div id="conceptQ" class="quiz-prompt"></div>
  <div id="conceptChoiceBox"></div>
  <div id="conceptTypeBox" style="display:none">
    <div class="hint-text">일본어 키보드로 정답 어미나 형태를 입력하세요 (예: って, かない)</div>
    <input type="text" id="conceptInput" class="typing-input" placeholder="여기에 입력..." onkeydown="if(event.key==='Enter')checkConceptTyping()">
    <button class="btn btn-ans" onclick="checkConceptTyping()">정답 확인</button>
  </div>
  <div id="conceptFeedback" class="feedback-box"></div>
  <button class="btn btn-next" onclick="nextConcept()">다음 개념 문제 ➔</button>
</div>

<div id="t3" class="tab-content">
  <div class="mode-switch script-switch">
    <button id="qScript-hira" class="active" onclick="setQuizScriptMode('hira')">🔤 히라가나 버전</button>
    <button id="qScript-kanji" onclick="setQuizScriptMode('kanji')">🈳 한자 버전</button>
  </div>
  <div class="mode-switch">
    <button id="qMode-choice" class="active" onclick="setQuizInputMode('choice')">🔘 4지선다 고르기</button>
    <button id="qMode-type" onclick="setQuizInputMode('type')">⌨️ 직접 타자 입력</button>
  </div>
  <div class="filter-box">
    <span><input type="checkbox" id="quizStarOnly" onchange="nextQuiz()"> <label for="quizStarOnly">⭐ 별표만</label></span>
    <select id="quizFormFilter" class="mode-select" onchange="nextQuiz()">
      <option value="all">🎲 て형 · ない형 랜덤</option>
      <option value="te">て형 (테형) 집중</option>
      <option value="nai">ない형 (나이형) 집중</option>
    </select>
  </div>
  <div id="quizBadge" class="quiz-badge"></div>
  <div id="quizQ" class="quiz-prompt"></div>
  <div id="quizOpts"></div>
  <div id="quizTypeBox" style="display:none">
    <div id="quizTypingHint" class="hint-text">히라가나로 활용형을 직접 입력하세요.</div>
    <input type="text" id="quizInput" class="typing-input" placeholder="활용형을 직접 입력하세요..." onkeydown="if(event.key==='Enter')checkQuizTyping()">
    <button class="btn btn-ans" onclick="checkQuizTyping()">정답 확인</button>
  </div>
  <div id="quizFeedback" class="feedback-box"></div>
  <button class="btn btn-next" onclick="nextQuiz()">다음 동사 문제 ➔</button>
</div>

<div id="t4" class="tab-content">
  <div class="filter-box">
    <span><input type="checkbox" id="dictStarOnly" onchange="nextDict()"> <label for="dictStarOnly">⭐ 헷갈리는 단어만 출제</label></span>
  </div>
  <div id="qMeaning" style="font-size:1.2rem;font-weight:bold;text-align:center;margin-bottom:5px"></div>
  <div class="canvas-container"><canvas id="paint" width="260" height="260"></canvas></div>
  <button class="btn btn-sub" onclick="clearBoard()">지우기</button>
  <button class="btn btn-ans" onclick="showAnswer()">정답 확인</button>
  <div id="ansText" style="display:none;text-align:center;font-size:1.05rem;font-weight:bold;margin-top:10px;color:#2c3e50;line-height:1.5"></div>
  <button class="btn btn-next" onclick="nextDict()">다음 문제 ➔</button>
</div>

<script>
const raw=`1|言う|いう|말하다(일상적)|1류|言って|いって|言わない|いわない

38|掛る|かかる|걸리다|1류|掛って|かかって|掛らない|かからない
39|頑張る|がんばる|노력하다|1류|頑張って|がんばって|頑張らない|がんばらない
40|ある|ある|있다|1류|あって|あって|ない|ない
41|止まる|とまる|멈추다|1류|止まって|とまって|止まらない|とまらない
42|降る|ふる|내리다(눈,비)|1류|降って|ふって|降らない|ふらない
43|戻る|もどる|되돌아오다|1류|戻って|もどって|戻らない|もどらない

51|走る|はしる|달리다|1류(예외)|走って|はしって|走らない|はしらない
52|要る|いる|필요하다|1류(예외)|要って|いって|要らない|いらない

54|見る|みる|보다|2류|見て|みて|見ない|みない

73|くれる|くれる|주다|2류|くれて|くれて|くれない|くれない

const defaultWords=raw.split('\n').map(l=>{const r=l.split('|');return{id:+r[0],kanji:r[1],hira:r[2],mean:r[3],group:r[4],te:r[5],teH:r[6],nai:r[7],naiH:r[8],starred:false};});

const conceptRules=[
  {cat:'te',badge:'て형 규칙 (1류)',q:'어미가「う・つ・る」로 끝나는 1류 동사의 て형 변화는?',ans:'って',fakes:['いて','んで','して'],desc:'う・つ・る ➔ って (촉음편: 言う→言って, 待つ→待って, 乗る→乗って)'},
  {cat:'te',badge:'て형 규칙 (1류)',q:'어미가「む・ぶ・ぬ」로 끝나는 1류 동사의 て형 변화는?',ans:'んで',fakes:['って','いて','いで'],desc:'む・ぶ・ぬ ➔ んで (발음편: 飲む→飲んで, 遊ぶ→遊んで, 死ぬ→死んで)'},
  {cat:'te',badge:'て형 규칙 (1류)',q:'어미가「く」로 끝나는 1류 동사(行く 제외)의 て형 변화는?',ans:'いて',fakes:['いで','って','して'],desc:'く ➔ いて (이음편: 書く→書いて, 聞く→聞いて)'},
  {cat:'te',badge:'て형 규칙 (1류)',q:'어미가「ぐ」로 끝나는 1류 동사의 て형 변화는?',ans:'いで',fakes:['いて','んで','って'],desc:'ぐ ➔ いで (탁음 유지: 泳ぐ→泳いで)'},
  {cat:'te',badge:'て형 규칙 (1류)',q:'어미가「す」로 끝나는 1류 동사의 て형 변화는?',ans:'して',fakes:['って','いて','んで'],desc:'す ➔ して (話す→話して, 押す→押して)'},
  {cat:'te',badge:'て형 예외 (1류)',q:'「行く(가다)」의 て형은 어미가 く이지만 예외로 무엇이 될까요?',ans:'行って',fakes:['行いて','行いで','行んで'],desc:'行く는 이음편(行いて)이 아니라 촉음편「行って(いって)」로 변합니다!'},
  {cat:'te',badge:'て형 규칙 (2류)',q:'2류 동사의 て형 만드는 공식은?',ans:'る를 떼고 て',fakes:['る를 떼고 って','る를 り로 바꾸고 て','る를 떼고 んで'],desc:'2류 동사는 무조건 어미 る를 탈락시키고「て」를 붙입니다 (食べる→食べて)'},
  {cat:'te',badge:'て형 규칙 (3류)',q:'3류 동사「来る(くる)」의 て형 발음과 표기는?',ans:'来て(きて)',fakes:['来て(くて)','来て(こて)','来って(きって)'],desc:'来る는 て형에서「来て(きて)」로 읽습니다.'},
  {cat:'te',badge:'て형 규칙 (3류)',q:'3류 동사「する(하다)」의 て형은?',ans:'して',fakes:['すて','しって','しんで'],desc:'する ➔ して'},
  {cat:'nai',badge:'ない형 규칙 (1류)',q:'1류 동사의 ない형 기본 만드는 법은? (う로 끝나는 동사 제외)',ans:'어미를 あ단으로 바꾸고 ない',fakes:['어미를 い단으로 바꾸고 ない','어미를 え단으로 바꾸고 ない','어미를 떼고 ない'],desc:'1류 동사는 う단 어미를 あ단으로 바꾼 뒤「ない」를 붙입니다 (書く→書かない)'},
  {cat:'nai',badge:'ない형 주의 (1류)',q:'어미가「う」로 끝나는 1류 동사(言う, 買う 등)의 ない형 어미 변화는?',ans:'わない',fakes:['あない','いない','ったない'],desc:'う는 あ가 아니라「わ」로 바뀝니다! (言う→言わない, 使う→使わない)'},
  {cat:'nai',badge:'ない형 예외 (1류)',q:'1류 동사「ある(있다)」의 ない형은 무엇일까요?',ans:'ない',fakes:['あらない','あわない','いない'],desc:'ある의 부정형은 あらない가 아니라 그냥「ない」입니다!'},
  {cat:'nai',badge:'ない형 규칙 (2류)',q:'2류 동사의 ない형 만드는 공식은?',ans:'る를 떼고 ない',fakes:['る를 らない로 변경','る를 わない로 변경','る를 れない로 변경'],desc:'2류 동사는 る만 떼고「ない」를 붙입니다 (見る→見ない, 食べる→食べない)'},
  {cat:'nai',badge:'ない형 규칙 (3류)',q:'3류 동사「来る(くる)」의 ない형 발음과 표기는?',ans:'来ない(こない)',fakes:['来ない(きない)','来ない(くない)','来らない(こらない)'],desc:'来る는 ない형에서「来ない(こない)」로 읽습니다!'},
  {cat:'nai',badge:'ない형 규칙 (3류)',q:'3류 동사「する(하다)」의 ない형은?',ans:'しない',fakes:['すない','さない','せない'],desc:'する ➔ しない'}
];

const STORAGE_KEY='jp_quiz_v4_stars';
let words=defaultWords;
try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');words=defaultWords.map(w=>({...w,starred:!!s[w.id]}));}catch(e){}
function saveStars(){try{const m={};words.forEach(w=>{if(w.starred)m[w.id]=true;});localStorage.setItem(STORAGE_KEY,JSON.stringify(m));}catch(e){}}

let curConcept=null,curQuiz=null,curQuizForm='te',quizScriptMode='hira',curDict=null,cv,ctx,drawing=false;
let curVocab=null,vocabType='mean',vocabScript='kanji',vocabDir='k2h';
const $=id=>document.getElementById(id);

function goTab(id){
  document.querySelectorAll('.tab-content,.tab-nav button').forEach(e=>e.classList.remove('active'));
  $(id).classList.add('active');$('btn-'+id).classList.add('active');
}

function renderWordList(){
  const list=$('wordList'),starOnly=$('starOnly').checked;
  const f=starOnly?words.filter(w=>w.starred):words;
  $('wordCount').innerText=f.length;
  if(!f.length){list.innerHTML='<div style="text-align:center;color:#888;padding:20px">⭐ 마크 표시된 단어가 없습니다.</div>';return;}
  list.innerHTML=f.map(w=>`<div class="card"><div style="flex:1"><div><b>${w.kanji}</b> (${w.hira}) <span class="group-tag ${w.group.includes('예외')?'exc':''}">${w.group}</span> - ${w.mean}</div><div class="conj-row">て형: <b>${w.te}</b> (${w.teH}) · ない형: <b>${w.nai}</b> (${w.naiH})</div></div><button class="star-btn ${w.starred?'starred':''}" onclick="toggleStar(${w.id})">★</button></div>`).join('');
}
function toggleStar(id){const w=words.find(x=>x.id===id);if(w){w.starred=!w.starred;saveStars();renderWordList();}}

/* --- 어휘 퀴즈 (뜻 맞추기 / 한자↔히라가나 연결하기) --- */
function setVocabType(t){
  vocabType=t;
  $('vType-mean').classList.toggle('active',t==='mean');
  $('vType-match').classList.toggle('active',t==='match');
  $('vMeanScriptBox').style.display=t==='mean'?'flex':'none';
  $('vMatchDirBox').style.display=t==='match'?'flex':'none';
  nextVocab();
}
function setVocabScript(s){
  vocabScript=s;
  $('vScript-kanji').classList.toggle('active',s==='kanji');
  $('vScript-hira').classList.toggle('active',s==='hira');
  nextVocab();
}
function setVocabDir(d){
  vocabDir=d;
  $('vDir-k2h').classList.toggle('active',d==='k2h');
  $('vDir-h2k').classList.toggle('active',d==='h2k');
  nextVocab();
}
function nextVocab(){
  const starOnly=$('vocabStarOnly').checked;
  let pool=starOnly?words.filter(w=>w.starred):words;
  if(!pool.length){alert('⭐ 마크 표시한 단어가 없습니다!');$('vocabStarOnly').checked=false;nextVocab();return;}

  if(vocabType==='match'){
    const kPool=pool.filter(w=>w.kanji!==w.hira);
    if(!kPool.length){
      alert('별표 단어 중 한자 표기가 따로 있는 단어가 없어 전체 단어로 전환합니다.');
      $('vocabStarOnly').checked=false;nextVocab();return;
    }
    pool=kPool;
  }

  curVocab=pool[Math.floor(Math.random()*pool.length)];
  $('vocabFeedback').style.display='none';
  const opts=$('vocabOpts');opts.innerHTML='';

  if(vocabType==='mean'){
    const isK=vocabScript==='kanji';
    $('vocabBadge').innerText=`[${isK?'한자':'히라가나'}] 동사 뜻 맞추기`;
    $('vocabQ').innerText=`「${isK?curVocab.kanji:curVocab.hira}」\n👉 이 동사의 알맞은 뜻은?`;
    const target=curVocab.mean;
    const fakes=[...new Set(words.filter(w=>w.mean!==target).map(w=>w.mean))].sort(()=>Math.random()-.5).slice(0,3);
    [target,...fakes].sort(()=>Math.random()-.5).forEach(c=>{
      const b=document.createElement('button');b.className='btn';b.style.margin='4px 0';b.innerText=c;
      b.onclick=()=>showVocabResult(c===target,target);opts.appendChild(b);
    });
  }else{
    const isK2H=vocabDir==='k2h';
    $('vocabBadge').innerText=isK2H?'한자 ➔ 히라가나 읽기 연결':'히라가나 ➔ 한자 표기 연결';
    $('vocabQ').innerText=isK2H
      ?`「${curVocab.kanji}」\n👉 이 한자 동사의 올바른 히라가나 읽기는?`
      :`「${curVocab.hira}」\n👉 이 히라가나 동사의 올바른 한자 표기는?`;
    const target=isK2H?curVocab.hira:curVocab.kanji;
    const field=isK2H?'hira':'kanji';
    const kWords=words.filter(w=>w.kanji!==w.hira && w[field]!==target);
    const fakes=[...new Set(kWords.map(w=>w[field]))].sort(()=>Math.random()-.5).slice(0,3);
    [target,...fakes].sort(()=>Math.random()-.5).forEach(c=>{
      const b=document.createElement('button');b.className='btn';b.style.margin='4px 0';b.innerText=c;
      b.onclick=()=>showVocabResult(c===target,target);opts.appendChild(b);
    });
  }
}
function showVocabResult(ok,ans){
  const fb=$('vocabFeedback');fb.style.display='block';fb.className='feedback-box '+(ok?'feedback-ok':'feedback-no');
  fb.innerHTML=(ok?`⭕ 정답입니다! 「${ans}」`:`❌ 오답! 정답은 「${ans}」`)+`<br><span style="font-weight:normal;font-size:.85rem">${curVocab.kanji} (${curVocab.hira}) - ${curVocab.mean} [${curVocab.group}]</span>`;
}

/* --- 개념 연습 --- */
function setConceptMode(m){
  $('cMode-choice').classList.toggle('active',m==='choice');$('cMode-type').classList.toggle('active',m==='type');
  $('conceptChoiceBox').style.display=m==='choice'?'block':'none';$('conceptTypeBox').style.display=m==='type'?'block':'none';
  $('conceptFeedback').style.display='none';
}
function nextConcept(){
  const f=$('conceptFilter').value,pool=f==='all'?conceptRules:conceptRules.filter(r=>r.cat===f);
  curConcept=pool[Math.floor(Math.random()*pool.length)];
  $('conceptBadge').innerText=curConcept.badge;$('conceptQ').innerText=curConcept.q;
  $('conceptFeedback').style.display='none';$('conceptInput').value='';
  const box=$('conceptChoiceBox');box.innerHTML='';
  [curConcept.ans,...curConcept.fakes].sort(()=>Math.random()-.5).forEach(c=>{
    const b=document.createElement('button');b.className='btn';b.style.margin='4px 0';b.innerText=c;
    b.onclick=()=>showConceptResult(c===curConcept.ans);box.appendChild(b);
  });
}
function checkConceptTyping(){
  const v=$('conceptInput').value.trim().replace(/\s+/g,'');if(!v)return;
  const c=curConcept.ans.replace(/\(.*?\)/g,'').replace(/\s+/g,'');
  showConceptResult(v===curConcept.ans.replace(/\s+/g,'')||v===c);
}
function showConceptResult(ok){
  const fb=$('conceptFeedback');fb.style.display='block';fb.className='feedback-box '+(ok?'feedback-ok':'feedback-no');
  fb.innerHTML=(ok?'⭕ 정답입니다!':`❌ 오답! 정답: ${curConcept.ans}`)+`<br><span style="font-weight:normal;font-size:.85rem">${curConcept.desc}</span>`;
}

/* --- 활용 퀴즈 --- */
function setQuizScriptMode(s){
  quizScriptMode=s;$('qScript-hira').classList.toggle('active',s==='hira');$('qScript-kanji').classList.toggle('active',s==='kanji');
  $('quizTypingHint').innerText=s==='hira'?'히라가나로 활용형을 직접 입력하세요.':'한자 표기(또는 히라가나)로 활용형을 직접 입력하세요.';
  renderCurrentQuiz();
}
function setQuizInputMode(m){
  $('qMode-choice').classList.toggle('active',m==='choice');$('qMode-type').classList.toggle('active',m==='type');
  $('quizOpts').style.display=m==='choice'?'block':'none';$('quizTypeBox').style.display=m==='type'?'block':'none';
  $('quizFeedback').style.display='none';
}
function makeFakes(w,ft,isH){
  const bw=isH?w.hira:w.kanji,st=bw.slice(0,-1),ans=isH?w[ft+'H']:w[ft],fk=new Set();
  if(ft==='te')[st+'て',st+'って',st+'いて',st+'んで',st+'いで',st+'して'].forEach(x=>fk.add(x));
  else{[st+'ない',st+'あない',st+'らない',st+'わない',st+'いない',bw+'ない'].forEach(x=>fk.add(x));if(w.hira==='ある')['あらない','あわない','いない'].forEach(x=>fk.add(x));}
  fk.delete(ans);fk.delete(w[ft]);fk.delete(w[ft+'H']);
  return Array.from(fk).slice(0,3);
}
function nextQuiz(){
  const starOnly=$('quizStarOnly').checked,f=$('quizFormFilter').value;
  const pool=starOnly?words.filter(w=>w.starred):words;
  if(!pool.length){alert('⭐ 마크 표시한 단어가 없습니다!');$('quizStarOnly').checked=false;nextQuiz();return;}
  curQuiz=pool[Math.floor(Math.random()*pool.length)];
  curQuizForm=f==='all'?(Math.random()<.5?'te':'nai'):f;
  renderCurrentQuiz();
}
function renderCurrentQuiz(){
  if(!curQuiz)return;
  const isH=quizScriptMode==='hira',names={te:'て형 (테형)',nai:'ない형 (나이형)'};
  $('quizBadge').innerText=`[${isH?'히라가나':'한자'}] ${names[curQuizForm]} 맞추기`;
  $('quizQ').innerText=`${isH?curQuiz.hira:curQuiz.kanji} - ${curQuiz.mean}\n👉 올바른 ${names[curQuizForm]}은?`;
  $('quizFeedback').style.display='none';$('quizInput').value='';
  const opts=$('quizOpts');opts.innerHTML='';
  const target=isH?curQuiz[curQuizForm+'H']:curQuiz[curQuizForm];
  [target,...makeFakes(curQuiz,curQuizForm,isH)].sort(()=>Math.random()-.5).forEach(c=>{
    const b=document.createElement('button');b.className='btn';b.style.margin='4px 0';b.innerText=c;
    b.onclick=()=>showQuizResult(c===target);opts.appendChild(b);
  });
}
function checkQuizTyping(){
  const v=$('quizInput').value.trim().replace(/\s+/g,'');if(!v)return;
  const isH=quizScriptMode==='hira';
  showQuizResult(isH?(v===curQuiz[curQuizForm+'H']):(v===curQuiz[curQuizForm]||v===curQuiz[curQuizForm+'H']));
}
function showQuizResult(ok){
  const ans=curQuiz[curQuizForm],ansH=curQuiz[curQuizForm+'H'];
  const disp=(quizScriptMode==='hira'||ans===ansH)?ansH:`${ans} (${ansH})`;
  const fb=$('quizFeedback');fb.style.display='block';fb.className='feedback-box '+(ok?'feedback-ok':'feedback-no');
  fb.innerHTML=(ok?`⭕ 정답입니다! 「${disp}」`:`❌ 오답! 정답은 「${disp}」`)+`<br><span style="font-weight:normal;font-size:.84rem">[${curQuiz.group}] て형: ${curQuiz.te} / ない형: ${curQuiz.nai}</span>`;
}

/* --- 쓰기 --- */
function clearBoard(){if(ctx)ctx.clearRect(0,0,cv.width,cv.height);$('ansText').style.display='none';}
function showAnswer(){const a=$('ansText');a.style.display=a.style.display==='none'?'block':'none';}
function nextDict(){
  const starOnly=$('dictStarOnly').checked,pool=starOnly?words.filter(w=>w.starred):words;
  if(!pool.length){alert('⭐ 마크 표시한 단어가 없습니다!');$('dictStarOnly').checked=false;nextDict();return;}
  curDict=pool[Math.floor(Math.random()*pool.length)];
  $('qMeaning').innerText=`뜻: ${curDict.mean}`;clearBoard();
  $('ansText').innerHTML=`기본형: ${curDict.kanji} (${curDict.hira}) [${curDict.group}]<br><span style="font-size:.88rem;color:#555">て형: ${curDict.te} · ない형: ${curDict.nai}</span>`;
}

function initApp(){
  renderWordList();cv=$('paint');
  if(cv){
    ctx=cv.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#ff1493';
    const pos=e=>{const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
    cv.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
    cv.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
    cv.addEventListener('touchend',()=>drawing=false);
    cv.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
    cv.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
    cv.addEventListener('mouseup',()=>drawing=false);
  }
  nextVocab();nextConcept();nextQuiz();nextDict();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);else initApp();
</script>
